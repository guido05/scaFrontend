<div class="row">
  <div class="col-sm-12">
    <app-card cardTitle="{{'Crear un nuevo dia' | translate}}" [options]="false">
      <form class="form-group" [formGroup]="diaForm">

        <div class="form-group">
          <label class="col-md-0.5">{{'Nombre' | translate}}</label>
          <div class = "col-md-5">
              <input class="form-control" required type="text" name="dia" id="dia" placeholder="{{'Nombre del dia' | translate}}" formControlName="nombre">
          </div>
        </div>
     
      <div>
      </div>
      <button  type="submit" class="btn btn-primary mb-2" [disabled]="diaForm.invalid" (click)="this.addDia()"> {{'Confirmar' | translate}}</button>
      <div class="form-group">
        <button class="btn btn-dark mb-2"  (click)="goToList()">{{'Volver a la lista' | translate}}</button>
       </div>
    </form>
</app-card>
</div>
</div>

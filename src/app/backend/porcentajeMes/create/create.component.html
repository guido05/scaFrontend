<div class="row">
  <div class="col-sm-12">
    <app-card cardTitle="{{'Crear un nuevo Porcentaje Mes' | translate}}" [options]="false">
      <form class="form-group" [formGroup]="porcentajeMesForm">

        <div class="form-group">
          <label for="porcentajeAumento">{{'Porcentaje Aumento' | translate}}</label>
          <input class="form-control" required type="text" name="porcentajeAumento" id="porcentajeAumento" placeholder="{{'Porcentaje Aumento' | translate}}" formControlName="porcentaje_aumento">
        </div>

        <div class="form-group">
          <label for="mes">{{'Mes' | translate}}</label>
          <input class="form-control" required type="text" name="mes" id="mes" placeholder="{{'Mes' | translate}}" formControlName="mes">
        </div>

        <div class="form-group">
          <label for="ano">{{'Año' | translate}}</label>
          <input class="form-control" required type="text" name="ano" id="ano" placeholder="{{'Porcentaje Mes' | translate}}" formControlName="ano">
        </div>
        
        <button  type="submit" class="btn btn-primary mb-2" (click)="this.addPorcentajeMes()">{{'Confirmar' | translate}}</button>
        <div class="form-group">
          <button class="btn btn-dark mb-2" (click)="goToList()">{{'Volver a la lista' | translate}}</button>
        </div>
      </form>
</app-card>
</div>
</div>

<div class="row">
  <div class="col-sm-12">
    <app-card cardTitle="{{'Crear un nueva firma' | translate}}" [options]="false">
      <form class="form-group" [formGroup]="firmaForm">

        <div class="form-group">
          <label class="col-md-0.5">{{'Firma' | translate}}</label>
          <div class="col-md-5">
            <input class="form-control" required type="text" name="firma" id="firma"
              placeholder="{{'Firma del asociado' | translate}}" formControlName="firma">
          </div>
        </div>
        <div class="form-group">
          <label class="col-md-0.5">{{'Dedo1' | translate}}</label>
          <div class="col-md-5">
            <input class="form-control" required type="text" name="dedo1" id="dedo1"
              placeholder="{{'Dedo1 del asociado' | translate}}" formControlName="dedo1">
          </div>
        </div>
        <div class="form-group">
          <label class="col-md-0.5">{{'Dedo2' | translate}}</label>
          <div class="col-md-5">
            <input class="form-control" required type="text" name="dedo2" id="dedo2"
              placeholder="{{'Dedo2 del asociado' | translate}}" formControlName="dedo2">
          </div>
        </div>

        <div class="form-group">
          <label class="col-md-0.5">{{'Dedo3' | translate}}</label>
          <div class="col-md-5">
            <input class="form-control" required type="text" name="dedo3" id="dedo3"
              placeholder="{{'Dedo3 del asociado' | translate}}" formControlName="dedo3">
          </div>
        </div>

        <div class="form-group">
          <label class="col-md-0.5">{{'Dedo4' | translate}}</label>
          <div class="col-md-5">
            <input class="form-control" required type="text" name="dedo4" id="dedo4"
              placeholder="{{'Dedo4 del asociado' | translate}}" formControlName="dedo4">
          </div>
        </div>

        <button type="submit" class="btn btn-primary mb-2" [disabled]="firmaForm.invalid"
          (click)="this.addFirma()"> {{'Confirmar' | translate}}</button>
        <div class="form-group">
          <button class="btn btn-dark mb-2" (click)="goToList()">{{'Volver a la lista' | translate}}</button>
        </div>
      </form>
    </app-card>
  </div>
</div>
